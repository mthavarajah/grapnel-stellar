      "Operation": {
        "type": "object",
        "properties": {
          "operation_id": {
            "type": "string"
          },
          "customer_id": {
            "type": "string"
          },
          "wallet_id": {
            "type": "string"
          },
          "module": {
            "type": "string"
          },
          "type": {
            "type": "string"
          },
          "status": {
            "enum": [
              "accepted",
              "validating",
              "preparing",
              "awaiting_customer_authorization",
              "submitted",
              "confirming",
              "completed",
              "rejected",
              "expired",
              "failed",
              "recovery_required"
            ]
          },
          "network": {
            "const": "stellar-testnet"
          },
          "tx_hash": {
            "type": [
              "string",
              "null"
            ]
          },
          "provider": {
            "type": "string"
          },
          "created_at": {
            "type": "string"
          },
          "updated_at": {
            "type": "string"
          },
          "error": {
            "type": [
              "object",
              "null"
            ]
          },
          "prepared_action": {
            "type": "object"
          },
          "customer_action_token": {
            "type": "string"
          },
          "display_amount": {
            "type": "string",
            "description": "Exact approved input amount for customer activity"
          },
          "display_asset_id": {
            "type": "string"
          }
        },
        "required": [
          "operation_id",
          "status",
          "network",
          "tx_hash"
        ],
        "additionalProperties": false
      },
      "MarginCustomerBinding": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "customer_id"
        ],
        "properties": {
          "customer_id": {
            "type": "string",
            "format": "uuid"
          },
          "wallet_id": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "MarginWorkflowInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "customer_id",
          "market_id",
          "direction",
          "leverage",
          "amount",
          "slippage_bps"
        ],
        "properties": {
          "customer_id": {
            "type": "string",
            "format": "uuid"
          },
          "wallet_id": {
            "type": "string",
            "format": "uuid"
          },
          "market_id": {
            "type": "string",
            "maxLength": 200
          },
          "direction": {
            "type": "string",
            "enum": [
              "long",
              "short"
            ]
          },
          "leverage": {
            "type": "integer",
            "enum": [
              2,
              3,
              4,
              5
            ]
          },
          "amount": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)(\\.[0-9]{1,7})?$",
            "description": "Must be positive; exact seven-decimal amount conversion."
          },
          "slippage_bps": {
            "type": "integer",
            "minimum": 0,
            "maximum": 50
          }
        }
      },
      "MarginStepTerms": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "minimumOutputAtomic": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,37}$"
          },
          "maximumInputAtomic": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,37}$"
          },
          "minimumDebtOutputAtomic": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,37}$"
          }
        }
      },
      "MarginStepInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "customer_id",
          "terms"
        ],
        "properties": {
          "customer_id": {
            "type": "string",
            "format": "uuid"
          },
          "wallet_id": {
            "type": "string",
            "format": "uuid"
          },
          "terms": {
            "$ref": "#/components/schemas/MarginStepTerms"
          }
        }
      },
      "MarginCollateralFundingQuoteInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "customer_id",
          "amount"
        ],
        "properties": {
          "customer_id": {
            "type": "string",
            "format": "uuid"
          },
          "wallet_id": {
            "type": "string",
            "format": "uuid"
          },
          "amount": {
            "type": "string",
            "description": "Positive exact native XLM amount, at most10XLM and seven decimals."
          }
        }
      },
      "MarginCollateralFundingInput": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "customer_id",
          "amount",
          "minimum_output_atomic"
        ],
        "properties": {
          "customer_id": {
            "type": "string",
            "format": "uuid"
          },
          "wallet_id": {
            "type": "string",
            "format": "uuid"
          },
          "amount": {
            "type": "string",
            "description": "Positive exact native XLM amount, at most10XLM and seven decimals."
          },
          "minimum_output_atomic": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,37}$"
          }
        }
      },
      "StockFundingIdentity": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "customer_id",
          "wallet_id",
          "account_address"
        ],
        "properties": {
          "customer_id": {
            "type": "string",
            "format": "uuid"
          },
          "wallet_id": {
            "type": "string",
            "format": "uuid"
          },
          "account_address": {
            "type": "string",
            "pattern": "^0x[0-9a-fA-F]{40}$"
          }
        }
      },
      "StockExecutionPrepare": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "customer_id",
          "wallet_id",
          "account_address",
          "market_id",
          "kind",
          "side",
          "amount",
          "slippage_bps"
        ],
        "properties": {
          "customer_id": {
            "type": "string",
            "format": "uuid"
          },
          "wallet_id": {
            "type": "string",
            "format": "uuid"
          },
          "account_address": {
            "type": "string",
            "pattern": "^0x[0-9a-fA-F]{40}$"
          },
          "market_id": {
            "type": "string",
            "enum": [
              "robinhood-testnet:stocks:TSLA",
              "robinhood-testnet:stocks:AMZN",
              "robinhood-testnet:stocks:PLTR",
              "robinhood-testnet:stocks:NFLX",
              "robinhood-testnet:stocks:AMD"
            ]
          },
          "kind": {
            "type": "string",
            "enum": [
              "approval",
              "swap"
            ]
          },
          "side": {
            "type": "string",
            "enum": [
              "buy",
              "sell"
            ]
          },
          "amount": {
            "type": "string",
            "pattern": "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
          },
          "slippage_bps": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100
          }
        }
      },
      "StockExecutionAuthorize": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "customer_id",
          "wallet_id",
          "request_id",
          "signed_transaction"
        ],
        "properties": {
          "customer_id": {
            "type": "string",
            "format": "uuid"
          },
          "wallet_id": {
            "type": "string",
            "format": "uuid"
          },
          "request_id": {
            "type": "string",
            "format": "uuid"
          },
          "signed_transaction": {
            "type": "string",
            "pattern": "^0x([a-fA-F0-9]{2})+$",
            "description": "Exact customer-signed Robinhood46630 EIP1559 transaction; no arbitrary calldata accepted."
          }
        }
      }
    }
  }
}
