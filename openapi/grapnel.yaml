{
  "openapi": "3.1.0",
  "info": {
    "title": "Grapnel Testnet API",
    "version": "0.4.0",
    "description": "Testnet B2B API with independently authorized customer wallets. Stellar funding, Crypto and Blend; canonical Robinhood Testnet USDG stock execution. Financial writes require current tenant permissions, customer ownership and actual chain proof. See docs/20_STOCKS_CUSTOMER_EXECUTION.md."
  },
  "servers": [
    {
      "url": "/",
      "description": "Current Grapnel API origin"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "operationId": "get_health",
        "security": [],
        "responses": {
          "200": {
            "description": "JSON data envelope; accepted operations require polling",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status",
                    "network",
                    "db"
                  ],
                  "properties": {
                    "status": {
                      "enum": [
                        "ok",
                        "degraded"
                      ]
                    },
                    "network": {
                      "const": "stellar-testnet"
                    },
                    "db": {
                      "enum": [
                        "ok",
                        "unavailable"
                      ]
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Permission denied",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Conflict or execution unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Database unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status",
                    "network",
                    "db"
                  ],
                  "properties": {
                    "status": {
                      "enum": [
                        "ok",
                        "degraded"
                      ]
                    },
                    "network": {
                      "const": "stellar-testnet"
                    },
                    "db": {
                      "enum": [
                        "ok",
                        "unavailable"
                      ]
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
