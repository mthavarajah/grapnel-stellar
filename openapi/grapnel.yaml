    "/v1/capital/wallets/{id}/valuation": {
      "get": {
        "operationId": "get_customer_wallet_valuation",
        "security": [
          {
            "businessKey": []
          }
        ],
        "description": "Requires capital.wallets and verified customer binding to the exact wallet. Wallet holdings only; estimated source-priced USD amounts. No fixed dollar peg is assumed.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "customer_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Envelope data: wallet_id, total_usd nullable, priced_subtotal_usd, unpriced_asset_count, as_of. Positive unpriced assets make total_usd null."
          },
          "401": {
            "description": "Business/customer authentication required"
          },
          "403": {
            "description": "Wallet module disabled"
          },
          "404": {
            "description": "Wallet/customer binding not found"
          }
        }
      }
    },
    "/v1/portfolio/valuation": {
      "get": {
        "operationId": "get_customer_account_valuation",
        "security": [
          {
            "businessKey": []
          }
        ],
        "description": "Requires capital.wallets and verified customer/wallet binding. Gross supported account assets include wallet holdings plus verified Earn and borrowing-pool supplied positions, with collateral counted once. Liabilities and net equity are separate. Missing sources or prices never imply a complete total.",
        "parameters": [
          {
            "name": "customer_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "wallet_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Envelope data: wallet_id, total_usd nullable, priced_subtotal_usd, unpriced_asset_count, unknown_source_count, liabilities_usd nullable, net_equity_usd nullable, as_of."
          },
          "401": {
            "description": "Business/customer authentication required"
          },
          "403": {
            "description": "Wallet module disabled"
          },
          "404": {
            "description": "Wallet/customer binding not found"
          }
        }
      }
    },
    "/v1/capital/lending/borrowing": {
      "get": {
        "operationId": "get_customer_borrowing_capacity",
        "security": [
          {
            "businessKey": []
          }
        ],
        "description": "Customer-scoped state in the separately pinned Testnet v2.1 pool. Rates are ratios; capacity uses the fresh protocol oracle and conservative health buffer. Existing Earn collateral is not moved or counted in this pool.",
        "parameters": [
          {
            "name": "customer_id",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "wallet_id",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Envelope data: pool_id, as_of, assets with actual debt/collateral, APR/APY ratios, nullable health/capacity and preparation flags. Each asset may include repay_all_amount (nullable exact maximum debit) and can_prepare_repay_all; unavailable confirmed spendable funds disable Max."
          },
          "401": {
            "description": "Customer authentication required"
          },
          "403": {
            "description": "Lending module disabled"
          }
        }
      }
    },
    "/v1/market-overview": {
      "get": {
        "operationId": "get_market_overview",
        "security": [
          {
            "businessKey": []
          }
        ],
        "description": "Requires capital.wallets. Only enabled trade.spot, trade.perps, trade.stocks and capital.lending sections are included. Read-only source reference prices and supply rates; no executable quote or holdings are implied.",
        "responses": {
          "200": {
            "description": "Envelope data: as_of, sections[{id,label,available,items[{symbol,name,value,unit,as_of}]}]. Maximum three source-backed items per section. USD reference prices or percentage-point supply APY strings; unavailable items omitted, never zero-filled."
          },
          "401": {
            "description": "Business key required"
          },
          "403": {
            "description": "Wallet module disabled"
          }
        }
      }
    },
    "/v1/trade/markets/{id}/history": {
      "get": {
        "operationId": "get_market_observed_history",
        "security": [
          {
            "businessKey": []
          }
        ],
        "description": "Entitled public market observations and source historical candles. Peridot Testnet history requires trade.perps; informational sodax:catalog identifiers require trade.stocks and resolve an exact verified catalog identity. Stock history is the underlying stock reference price, never a token execution quote. Prices use the explicit quote_symbol; no invented historical candles or USD peg is implied. Optional source_url, interval, price_basis, observed_at, metrics and real candles preserve source provenance.",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          },
          {
            "name": "range",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "live",
                "1d",
                "1w",
                "1m",
                "1y",
                "all"
